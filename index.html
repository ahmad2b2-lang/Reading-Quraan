<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="only light">
<meta name="theme-color" content="#f7f1e3">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>ورد القرآن</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Naskh+Arabic:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="preload" href="fonts/hafs.18.woff2" as="font" type="font/woff2" crossorigin>
<style>
  @font-face {
    font-family: "KFGQPC Hafs";
    src: url("fonts/hafs.18.woff2") format("woff2");
    font-display: block;
  }
  :root {
    color-scheme: only light;
    --paper: #f7f1e3;
    --page: #fffdf7;
    --ink: #1d2a24;
    --muted: #6c6a5e;
    --green: #1f5d4c;
    --green-dark: #164638;
    --green-soft: #e3ede7;
    --gold: #b08a3e;
    --gold-soft: #efe3c6;
    --line: #e4dac3;
    --danger: #a33a2e;
    --quran-size: 26px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--paper); color: var(--ink); }
  body {
    font-family: "Noto Naskh Arabic", "Segoe UI", Tahoma, sans-serif;
    font-size: 17px; line-height: 1.6;
    min-height: 100dvh;
  }
  button, input { font: inherit; }
  [hidden] { display: none !important; }

  .screen { min-height: 100dvh; display: flex; flex-direction: column; }
  .wrap { width: 100%; max-width: 520px; margin: 0 auto; padding: 0 16px; }

  /* ---------- Shared bits ---------- */
  .brand { text-align: center; padding: 48px 0 20px; }
  .brand .mark {
    width: 64px; height: 64px; margin: 0 auto 12px; border-radius: 18px;
    background: var(--green); color: var(--gold-soft);
    display: grid; place-items: center; font-family: "KFGQPC Hafs", serif; font-size: 34px;
    box-shadow: 0 6px 18px rgba(31,93,76,.22);
  }
  .brand h1 { margin: 0; font-size: 26px; color: var(--green-dark); }
  .brand p { margin: 4px 0 0; color: var(--muted); font-size: 15px; }

  .card {
    background: var(--page); border: 1px solid var(--line); border-radius: 18px;
    padding: 20px; box-shadow: 0 2px 10px rgba(80,60,20,.06);
  }
  .btn {
    display: block; width: 100%; border: 0; border-radius: 14px; cursor: pointer;
    padding: 14px 18px; font-size: 18px; font-weight: 700;
    background: var(--green); color: #fff; transition: background .15s, opacity .15s;
  }
  .btn:active { background: var(--green-dark); }
  .btn[disabled] { opacity: .55; cursor: default; }
  .btn.ghost { background: transparent; color: var(--green); border: 1.5px solid var(--green); }
  .link {
    background: none; border: 0; color: var(--green); cursor: pointer; padding: 8px;
    font-size: 15px; text-decoration: underline; text-underline-offset: 4px;
  }
  .error { color: var(--danger); font-size: 15px; min-height: 24px; margin: 8px 0 0; text-align: center; }

  /* ---------- Auth ---------- */
  .tabs { display: grid; grid-template-columns: 1fr 1fr; background: var(--green-soft); border-radius: 12px; padding: 4px; margin-bottom: 18px; }
  .tabs button { border: 0; background: transparent; padding: 10px; border-radius: 9px; font-weight: 600; color: var(--green-dark); cursor: pointer; }
  .tabs button.on { background: var(--page); box-shadow: 0 1px 4px rgba(0,0,0,.08); }
  label { display: block; font-size: 15px; color: var(--muted); margin: 0 0 6px; }
  .field { margin-bottom: 14px; }
  .field input {
    width: 100%; padding: 13px 14px; border-radius: 12px; border: 1.5px solid var(--line);
    background: #fff; color: var(--ink); font-size: 17px; outline: none;
  }
  .field input:focus { border-color: var(--green); }
  .field input.ltr { direction: ltr; text-align: left; }
  .hint { font-size: 13px; color: var(--muted); margin-top: 4px; }

  /* ---------- Home ---------- */
  .home-top { display: flex; justify-content: space-between; align-items: center; padding: 18px 0 6px; }
  .home-top .hello { font-size: 18px; font-weight: 600; color: var(--green-dark); }
  .next-card { text-align: center; margin-top: 18px; }
  .next-card .label { color: var(--muted); font-size: 15px; }
  .next-card .page-no { font-size: 56px; font-weight: 700; color: var(--green); line-height: 1.2; }
  .next-card .surah { font-family: "KFGQPC Hafs", serif; font-size: 26px; color: var(--ink); }
  .next-card .juz { color: var(--muted); font-size: 15px; }
  .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 14px 0 22px; }
  .stat { text-align: center; padding: 14px 10px; }
  .stat b { display: block; font-size: 24px; color: var(--gold); }
  .stat span { font-size: 14px; color: var(--muted); }
  .note { text-align: center; color: var(--muted); font-size: 15px; margin: 14px 0 0; }

  /* ---------- Popup ---------- */
  .overlay {
    position: fixed; inset: 0; background: rgba(29,42,36,.45); z-index: 50;
    display: flex; align-items: flex-end; justify-content: center; padding: 16px;
    animation: fade .2s ease;
  }
  @media (min-width: 560px) { .overlay { align-items: center; } }
  .sheet {
    width: 100%; max-width: 440px; background: var(--page); border-radius: 22px;
    padding: 24px 20px calc(20px + env(safe-area-inset-bottom)); text-align: center;
    animation: rise .25s ease;
  }
  .sheet h2 { margin: 0 0 4px; font-size: 21px; color: var(--green-dark); }
  .sheet p { margin: 0 0 18px; color: var(--muted); font-size: 15px; }
  .stepper { display: flex; align-items: center; justify-content: center; gap: 18px; margin-bottom: 14px; }
  .stepper button {
    width: 52px; height: 52px; border-radius: 50%; border: 1.5px solid var(--green);
    background: #fff; color: var(--green); font-size: 28px; line-height: 1; cursor: pointer;
  }
  .stepper button[disabled] { opacity: .35; }
  .stepper output { min-width: 84px; font-size: 44px; font-weight: 700; color: var(--green); }
  .chips { display: flex; justify-content: center; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; }
  .chips button {
    border: 1px solid var(--line); background: #fff; border-radius: 999px; padding: 6px 16px;
    color: var(--ink); cursor: pointer; font-size: 15px;
  }
  .chips button.on { background: var(--green-soft); border-color: var(--green); color: var(--green-dark); font-weight: 600; }
  .sheet .link { margin-top: 6px; }
  @keyframes fade { from { opacity: 0 } }
  @keyframes rise { from { transform: translateY(24px); opacity: 0 } }

  /* ---------- Reader ---------- */
  .reader-bar {
    position: sticky; top: 0; z-index: 10; background: var(--paper);
    padding: calc(8px + env(safe-area-inset-top)) 0 8px; border-bottom: 1px solid var(--line);
  }
  .reader-bar .row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .icon-btn {
    width: 38px; height: 38px; border-radius: 10px; border: 1px solid var(--line); background: var(--page);
    color: var(--green-dark); cursor: pointer; font-size: 16px; font-weight: 700;
  }
  .session-label { font-size: 15px; color: var(--green-dark); font-weight: 600; }
  .bar { height: 4px; background: var(--line); border-radius: 4px; margin-top: 8px; overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--gold); width: 0; transition: width .3s; }

  .mushaf {
    background: var(--page); margin: 14px 0 120px; border-radius: 6px; position: relative;
    border: 1px solid var(--gold); outline: 1px solid var(--gold); outline-offset: 4px;
    padding: 12px 14px 10px;
  }
  .mushaf-head {
    display: flex; justify-content: space-between; font-family: "KFGQPC Hafs", serif;
    font-size: 17px; color: var(--green-dark); border-bottom: 1px solid var(--gold-soft); padding-bottom: 6px;
  }
  .mushaf-text {
    font-family: "KFGQPC Hafs", serif; font-size: var(--quran-size); line-height: 2.05;
    text-align: justify; text-align-last: center; color: #111; padding: 10px 2px 4px;
    word-spacing: 1px;
  }
  .mushaf-text.centered { text-align: center; }
  .aya { white-space: normal; }
  .surah-title {
    display: block; margin: 10px 0 6px; padding: 6px 0; text-align: center;
    border: 1px solid var(--gold); border-radius: 6px; background: var(--gold-soft);
    font-size: calc(var(--quran-size) * .85); color: var(--green-dark); line-height: 1.8;
  }
  .basmala { display: block; text-align: center; margin: 2px 0 4px; }
  .mushaf-foot { text-align: center; font-size: 15px; color: var(--muted); border-top: 1px solid var(--gold-soft); padding-top: 4px; }

  .reader-actions {
    position: fixed; inset: auto 0 0 0; z-index: 10;
    background: linear-gradient(to top, var(--paper) 70%, rgba(247,241,227,0));
    padding: 22px 0 calc(14px + env(safe-area-inset-bottom));
  }
  .loading { text-align: center; color: var(--muted); padding: 60px 0; }

  /* ---------- Done ---------- */
  .done { flex: 1; display: flex; flex-direction: column; justify-content: center; text-align: center; padding: 32px 0; }
  .done .mark { font-size: 54px; margin-bottom: 4px; }
  .done h2 { margin: 0; font-size: 30px; color: var(--green); font-family: "KFGQPC Hafs", serif; font-weight: normal; }
  .done p { color: var(--muted); margin: 8px 0 26px; }

  .toast {
    position: fixed; left: 50%; bottom: 96px; transform: translateX(-50%); z-index: 99;
    background: var(--ink); color: #fff; padding: 10px 16px; border-radius: 12px; font-size: 15px;
    max-width: calc(100% - 32px); text-align: center;
  }
</style>
</head>
<body>

<!-- Loading -->
<section id="s-boot" class="screen"><div class="loading">…جارٍ التحميل</div></section>

<!-- Login / sign up -->
<section id="s-auth" class="screen" hidden>
  <div class="wrap">
    <div class="brand">
      <div class="mark">ق</div>
      <h1>ورد القرآن</h1>
      <p>اقرأ وِردك بتأنٍّ، صفحة بعد صفحة</p>
    </div>
    <div class="card">
      <div class="tabs" role="tablist">
        <button type="button" id="tab-login" class="on">تسجيل الدخول</button>
        <button type="button" id="tab-signup">حساب جديد</button>
      </div>
      <form id="auth-form" novalidate>
        <div class="field">
          <label for="f-user">اسم المستخدم</label>
          <input id="f-user" class="ltr" autocomplete="username" autocapitalize="none" spellcheck="false" maxlength="20" required>
          <div class="hint" id="user-hint" hidden>أحرف إنجليزية صغيرة وأرقام و _ فقط (٣–٢٠)</div>
        </div>
        <div class="field">
          <label for="f-pass">كلمة المرور</label>
          <input id="f-pass" class="ltr" type="password" autocomplete="current-password" required>
        </div>
        <div class="field" id="confirm-wrap" hidden>
          <label for="f-pass2">تأكيد كلمة المرور</label>
          <input id="f-pass2" class="ltr" type="password" autocomplete="new-password">
          <div class="hint">٦ أحرف على الأقل</div>
        </div>
        <button class="btn" id="auth-submit" type="submit">دخول</button>
        <p class="error" id="auth-error"></p>
      </form>
    </div>
  </div>
</section>

<!-- Main page -->
<section id="s-home" class="screen" hidden>
  <div class="wrap">
    <div class="home-top">
      <div class="hello" id="hello"></div>
      <button class="link" id="logout" type="button">خروج</button>
    </div>
    <div class="card next-card">
      <div class="label">صفحتك التالية</div>
      <div class="page-no" id="h-page"></div>
      <div class="surah" id="h-surah"></div>
      <div class="juz" id="h-juz"></div>
    </div>
    <div class="stats">
      <div class="card stat"><b id="h-read">٠</b><span>صفحات مقروءة</span></div>
      <div class="card stat"><b id="h-khatmas">٠</b><span>ختمات</span></div>
    </div>
    <button class="btn" id="start" type="button">ابدأ جلسة قراءة</button>
    <p class="note" id="h-note" hidden></p>
  </div>
</section>

<!-- Reader -->
<section id="s-reader" class="screen" hidden>
  <div class="reader-bar">
    <div class="wrap">
      <div class="row">
        <button class="icon-btn" id="end-early" type="button" aria-label="إنهاء الجلسة">✕</button>
        <div class="session-label" id="r-label"></div>
        <div style="display:flex;gap:6px">
          <button class="icon-btn" id="fs-up" type="button" aria-label="تكبير الخط">+</button>
          <button class="icon-btn" id="fs-down" type="button" aria-label="تصغير الخط">−</button>
        </div>
      </div>
      <div class="bar"><i id="r-bar"></i></div>
    </div>
  </div>
  <div class="wrap">
    <div class="mushaf" id="mushaf">
      <div class="loading">…جارٍ التحميل</div>
    </div>
  </div>
  <div class="reader-actions">
    <div class="wrap"><button class="btn" id="next" type="button">أتممتُ هذه الصفحة</button></div>
  </div>
</section>

<!-- Session complete -->
<section id="s-done" class="screen" hidden>
  <div class="wrap done">
    <div class="mark">🌿</div>
    <h2>تقبَّل الله منك</h2>
    <p id="d-text"></p>
    <button class="btn ghost" id="back-home" type="button">العودة إلى الصفحة الرئيسية</button>
  </div>
</section>

<!-- How many pages popup -->
<div class="overlay" id="popup" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="pp-title">
    <h2 id="pp-title">كم صفحة ستقرأ في هذه الجلسة؟</h2>
    <p id="pp-sub"></p>
    <div class="stepper">
      <button type="button" id="pp-plus" aria-label="زيادة">+</button>
      <output id="pp-count">١</output>
      <button type="button" id="pp-minus" aria-label="إنقاص">−</button>
    </div>
    <div class="chips" id="pp-chips"></div>
    <button class="btn" id="pp-go" type="button">ابدأ القراءة</button>
    <button class="link" id="pp-cancel" type="button">ليس الآن</button>
  </div>
</div>

<div class="toast" id="toast" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(() => {
  // ---------- Settings ----------
  const SUPABASE_URL = "https://bhfgwlkzkbwcwyoypwhy.supabase.co";
  const SUPABASE_KEY = "sb_publishable_9YylflVQca-62NHsBKSTeA_GY896nj3";
  const EMAIL_DOMAIN = "readers.reading-quraan.local"; // hidden; users only see usernames
  const AVAILABLE_PAGES = 20;   // pages currently in /pages (raise as more are added, up to 604)
  const TOTAL_PAGES = 604;
  const MAX_SESSION = 20;

  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
    auth: { persistSession: true, autoRefreshToken: true, storageKey: "reading-quraan-auth" }
  });

  // ---------- Helpers ----------
  const $ = (id) => document.getElementById(id);
  const ar = (n) => String(n).replace(/\d/g, (d) => "٠١٢٣٤٥٦٧٨٩"[d]);
  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : v; } catch { return d; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch {} }
  };
  const screens = ["s-boot", "s-auth", "s-home", "s-reader", "s-done"];
  function show(id) { screens.forEach((s) => ($(s).hidden = s !== id)); window.scrollTo(0, 0); }
  let toastTimer;
  function toast(msg) {
    const t = $("toast"); t.textContent = msg; t.hidden = false;
    clearTimeout(toastTimer); toastTimer = setTimeout(() => (t.hidden = true), 3200);
  }

  // ---------- Page data ----------
  const pageCache = new Map();
  function loadPage(n) {
    if (!pageCache.has(n)) {
      const p = fetch(`pages/${n}.json`).then((r) => { if (!r.ok) throw new Error("page"); return r.json(); });
      p.catch(() => pageCache.delete(n));
      pageCache.set(n, p);
    }
    return pageCache.get(n);
  }

  // ---------- State ----------
  let reader = null;          // row from quran_readers
  let session = null;         // { goal, done }
  let busy = false;

  async function fetchReader() {
    const { data, error } = await sb.from("quran_readers").select("*").maybeSingle();
    if (error) throw error;
    return data;
  }

  // ---------- Auth ----------
  let mode = "login";
  function setMode(m) {
    mode = m;
    $("tab-login").classList.toggle("on", m === "login");
    $("tab-signup").classList.toggle("on", m === "signup");
    $("confirm-wrap").hidden = m !== "signup";
    $("user-hint").hidden = m !== "signup";
    $("auth-submit").textContent = m === "login" ? "دخول" : "إنشاء الحساب";
    $("f-pass").autocomplete = m === "login" ? "current-password" : "new-password";
    $("auth-error").textContent = "";
  }
  $("tab-login").onclick = () => setMode("login");
  $("tab-signup").onclick = () => setMode("signup");

  $("auth-form").onsubmit = async (e) => {
    e.preventDefault();
    const err = $("auth-error");
    const username = $("f-user").value.trim().toLowerCase();
    const password = $("f-pass").value;
    err.textContent = "";

    if (!/^[a-z0-9_]{3,20}$/.test(username)) {
      err.textContent = "اسم المستخدم: أحرف إنجليزية صغيرة وأرقام و _ فقط (من ٣ إلى ٢٠)"; return;
    }
    if (password.length < 6) { err.textContent = "كلمة المرور ٦ أحرف على الأقل"; return; }
    if (mode === "signup" && password !== $("f-pass2").value) { err.textContent = "كلمتا المرور غير متطابقتين"; return; }

    const btn = $("auth-submit"); btn.disabled = true;
    try {
      if (mode === "signup") {
        const res = await fetch(`${SUPABASE_URL}/functions/v1/quran-signup`, {
          method: "POST",
          headers: { "Content-Type": "application/json", apikey: SUPABASE_KEY },
          body: JSON.stringify({ username, password })
        });
        const body = await res.json().catch(() => ({}));
        if (!res.ok) {
          err.textContent = body.error === "username_taken" ? "اسم المستخدم مستخدم، اختر اسمًا آخر"
            : "تعذّر إنشاء الحساب، حاول مرة أخرى";
          return;
        }
      }
      const { error } = await sb.auth.signInWithPassword({ email: `${username}@${EMAIL_DOMAIN}`, password });
      if (error) {
        err.textContent = /invalid/i.test(error.message) ? "اسم المستخدم أو كلمة المرور غير صحيحة" : "تعذّر تسجيل الدخول، تحقق من الاتصال";
        return;
      }
      $("f-pass").value = ""; $("f-pass2").value = "";
      await enterApp(true);
    } catch {
      err.textContent = "تعذّر الاتصال، تحقق من الإنترنت";
    } finally {
      btn.disabled = false;
    }
  };

  $("logout").onclick = async () => {
    await sb.auth.signOut();
    reader = null; session = null;
    setMode("login"); show("s-auth");
  };

  // ---------- Home ----------
  async function renderHome() {
    const p = reader.current_page;
    $("hello").textContent = `السلام عليكم، ${reader.username}`;
    $("h-page").textContent = ar(p);
    $("h-read").textContent = ar(reader.pages_read);
    $("h-khatmas").textContent = ar(reader.khatmas);
    const available = p <= AVAILABLE_PAGES;
    $("start").hidden = !available;
    $("h-note").hidden = available;
    $("h-note").textContent = available ? "" : `أتممت الصفحات المتاحة حاليًا (١–${ar(AVAILABLE_PAGES)}). ستُضاف صفحات أخرى قريبًا بإذن الله.`;
    $("h-surah").textContent = ""; $("h-juz").textContent = "";
    if (available) {
      try {
        const d = await loadPage(p);
        $("h-surah").textContent = "سورة " + d.surahs[0];
        $("h-juz").textContent = `الجزء ${ar(d.juz)}`;
      } catch {}
    }
  }

  async function enterApp(openPopup) {
    show("s-boot");
    try {
      reader = await fetchReader();
    } catch {
      toast("تعذّر تحميل تقدّمك، تحقق من الاتصال");
    }
    if (!reader) {
      await sb.auth.signOut();
      show("s-auth");
      $("auth-error").textContent = "هذا الحساب غير مسجّل في التطبيق";
      return;
    }
    await renderHome();
    show("s-home");
    if (openPopup && reader.current_page <= AVAILABLE_PAGES) openSessionPopup();
  }

  // ---------- "How many pages" popup ----------
  let ppCount = 1;
  function maxForSession() { return Math.max(1, Math.min(MAX_SESSION, AVAILABLE_PAGES - reader.current_page + 1)); }
  function setCount(n) {
    const max = maxForSession();
    ppCount = Math.min(Math.max(1, n), max);
    $("pp-count").textContent = ar(ppCount);
    $("pp-minus").disabled = ppCount <= 1;
    $("pp-plus").disabled = ppCount >= max;
    [...$("pp-chips").children].forEach((c) => c.classList.toggle("on", +c.dataset.n === ppCount));
  }
  function openSessionPopup() {
    const max = maxForSession();
    $("pp-sub").textContent = `تبدأ من الصفحة ${ar(reader.current_page)}`;
    $("pp-chips").innerHTML = "";
    [1, 2, 5, 10].filter((n) => n <= max).forEach((n) => {
      const b = document.createElement("button");
      b.type = "button"; b.dataset.n = n; b.textContent = n === 1 ? "صفحة" : n === 2 ? "صفحتان" : `${ar(n)} صفحات`;
      b.onclick = () => setCount(n);
      $("pp-chips").appendChild(b);
    });
    setCount(1);
    $("popup").hidden = false;
  }
  $("pp-plus").onclick = () => setCount(ppCount + 1);
  $("pp-minus").onclick = () => setCount(ppCount - 1);
  $("pp-cancel").onclick = () => ($("popup").hidden = true);
  $("start").onclick = openSessionPopup;
  $("pp-go").onclick = () => {
    $("popup").hidden = true;
    session = { goal: ppCount, done: 0 };
    show("s-reader");
    renderReader();
  };

  // ---------- Reader ----------
  const BASMALA = "بِسۡمِ ٱللَّهِ ٱلرَّحۡمَٰنِ ٱلرَّحِيمِ";
  function applyFontSize() { document.documentElement.style.setProperty("--quran-size", store.get("qr.fs", "26") + "px"); }
  function changeFont(delta) {
    const v = Math.min(40, Math.max(18, +store.get("qr.fs", "26") + delta));
    store.set("qr.fs", String(v)); applyFontSize();
  }
  $("fs-up").onclick = () => changeFont(2);
  $("fs-down").onclick = () => changeFont(-2);
  applyFontSize();

  function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }

  async function renderReader() {
    const n = reader.current_page;
    const step = session.done + 1;
    $("r-label").textContent = `الصفحة ${ar(step)} من ${ar(session.goal)}`;
    $("r-bar").style.width = `${(session.done / session.goal) * 100}%`;
    $("next").textContent = step === session.goal ? "أتممتُ الجلسة" : "أتممتُ هذه الصفحة";
    $("next").disabled = true;

    const box = $("mushaf");
    box.innerHTML = ""; box.appendChild(el("div", "loading", "…جارٍ التحميل"));
    let d;
    try { d = await loadPage(n); }
    catch { box.innerHTML = ""; box.appendChild(el("div", "loading", "تعذّر تحميل الصفحة، تحقق من الاتصال")); $("next").disabled = false; $("next").textContent = "إعادة المحاولة"; $("next").dataset.retry = "1"; return; }
    delete $("next").dataset.retry;

    box.innerHTML = "";
    const head = el("div", "mushaf-head");
    head.appendChild(el("span", null, "سورة " + d.surahs[d.surahs.length - 1]));
    head.appendChild(el("span", null, "الجزء " + ar(d.juz)));
    const text = el("div", "mushaf-text" + (n <= 2 ? " centered" : ""));
    for (const a of d.ayat) {
      if (a.a === 1) {
        text.appendChild(el("span", "surah-title", "سورة " + a.n));
        if (a.s !== 1 && a.s !== 9) text.appendChild(el("span", "basmala", BASMALA));
      }
      text.appendChild(el("span", "aya", a.t));
      text.appendChild(document.createTextNode(" "));
    }
    box.append(head, text, el("div", "mushaf-foot", ar(n)));
    window.scrollTo(0, 0);
    if (n < AVAILABLE_PAGES) loadPage(n + 1).catch(() => {});
    setTimeout(() => { $("next").disabled = false; }, 700); // guards against an accidental double tap
  }

  $("next").onclick = async () => {
    if (busy) return;
    if ($("next").dataset.retry) { renderReader(); return; }
    busy = true; $("next").disabled = true;
    const page = reader.current_page;
    try {
      const { data, error } = await sb.rpc("quran_complete_page", { p_page: page });
      if (error || !data) throw error || new Error("save");
      reader = data;
      session.done++;
      if (session.done >= session.goal || reader.current_page > AVAILABLE_PAGES) finishSession();
      else renderReader();
    } catch {
      toast("لم يُحفظ التقدّم، تحقق من الاتصال ثم حاول مرة أخرى");
      $("next").disabled = false;
    } finally {
      busy = false;
    }
  };

  $("end-early").onclick = async () => {
    if (!confirm("إنهاء الجلسة الآن؟ سيُحفظ تقدّمك حتى آخر صفحة أتممتها.")) return;
    session = null;
    await renderHome();
    show("s-home");
  };

  function finishSession() {
    const n = session.done;
    const pagesWord = n === 1 ? "صفحة واحدة" : n === 2 ? "صفحتين" : `${ar(n)} صفحات`;
    const next = reader.current_page <= AVAILABLE_PAGES
      ? `وِردك القادم يبدأ من الصفحة ${ar(reader.current_page)}.`
      : `أتممت الصفحات المتاحة حاليًا.`;
    $("d-text").textContent = `قرأت ${pagesWord} في هذه الجلسة. ${next}`;
    session = null;
    show("s-done");
  }
  $("back-home").onclick = async () => { await renderHome(); show("s-home"); };

  // ---------- Start ----------
  sb.auth.getSession().then(({ data }) => {
    if (data.session) enterApp(true);
    else show("s-auth");
  });
})();
</script>
</body>
</html>
